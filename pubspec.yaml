name: devmark
description: A Markdown editor for developers with code-first approach
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Markdown rendering
  flutter_markdown: ^0.6.18
  markdown: ^7.1.1

  # Code editor and syntax highlighting
  flutter_code_editor: ^0.3.0
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

  # File system operations
  file_selector: ^1.0.1
  path: ^1.8.3
  path_provider: ^2.1.1

  # State management
  provider: ^6.1.1

  # UI components
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/templates/
