name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Debug info only bloats the cache; nothing in CI reads it.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  linux:
    name: Linux (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: System libraries for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev \
            libasound2-dev libvulkan1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- --deny warnings
      - run: cargo test --workspace --locked
